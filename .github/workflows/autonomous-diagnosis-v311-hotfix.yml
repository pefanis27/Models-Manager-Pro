name: Autonomous Diagnosis v3.1.1 XYXY Vulkan Hotfix APK

on:
  push:
    branches:
      - autonomous-diagnosis-final-apk-20260818
    paths:
      - 'V311_BUILD_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: autonomous-diagnosis-v311-hotfix
  cancel-in-progress: true

jobs:
  build-v311-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout final build branch
        uses: actions/checkout@v4
        with:
          ref: autonomous-diagnosis-final-apk-20260818

      - name: Publish workflow run id immediately
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tool_payload
          echo "$GITHUB_RUN_ID" > tool_payload/final_v311_RUN_ID.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tool_payload/final_v311_RUN_ID.txt
          if git diff --cached --quiet; then
            echo 'Run id already current.'
          else
            git commit -m "[skip ci] publish v3.1.1 APK run id $GITHUB_RUN_ID"
            git push origin HEAD:autonomous-diagnosis-final-apk-20260818
          fi

      - name: Reconstruct verified v3.1.0 clean source
        shell: bash
        run: |
          set -euxo pipefail
          cat v310_clean_payload/part_00 v310_clean_payload/part_01 v310_clean_payload/part_02 > /tmp/v310_source.tar.gz.b64
          echo 'c275802a960e933dc555e994c90d9035f2835cad9a2e995c89a607629206d9bc  /tmp/v310_source.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/v310_source.tar.gz.b64 > /tmp/v310_source.tar.gz
          echo '6efaf644f5a141c01e8257dfb749da8534d82dc2eb6bba648d13a70f9b38ee0f  /tmp/v310_source.tar.gz' | sha256sum -c -
          rm -rf v311_android_project
          mkdir -p v311_android_project
          tar -xzf /tmp/v310_source.tar.gz -C v311_android_project

      - name: Apply and verify v3.1.1 hotfix
        shell: bash
        run: |
          set -euxo pipefail
          APP=v311_android_project/app
          cp autonomous_apk_build/v311_hotfix/MainActivity.kt "$APP/src/main/java/com/autonomousdiagnosis/app/MainActivity.kt"
          cp autonomous_apk_build/v311_hotfix/VideoDetectionTracker.kt "$APP/src/main/java/com/autonomousdiagnosis/app/VideoDetectionTracker.kt"
          cp autonomous_apk_build/v311_hotfix/native_detector.cpp "$APP/src/main/cpp/native_detector.cpp"
          sed -i 's/versionCode = 310/versionCode = 311/' "$APP/build.gradle.kts"
          sed -i 's/versionName = "3.1.0"/versionName = "3.1.1"/' "$APP/build.gradle.kts"
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in [Path('v311_android_project/MODEL_CONTRACT.json'), Path('v311_android_project/app/src/main/assets/model_contract.json')]:
              data=json.loads(path.read_text())
              data['release']='3.1.1'
              data['ncnn_output']='out0 float tensor [15,8400] = xyxy + 11 sigmoid probabilities'
              data['android_decoder']='XYXY direct corners; unletterbox only; no cxcywh reinterpretation'
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          grep -F 'versionCode = 311' "$APP/build.gradle.kts"
          grep -F 'versionName = "3.1.1"' "$APP/build.gradle.kts"
          grep -F 'private const val DETECTION_CONFIDENCE=0.25f' "$APP/src/main/java/com/autonomousdiagnosis/app/MainActivity.kt"
          grep -F 'text="Vulkan GPU"' "$APP/src/main/java/com/autonomousdiagnosis/app/MainActivity.kt"
          grep -F 'reloadModel(checked)' "$APP/src/main/java/com/autonomousdiagnosis/app/MainActivity.kt"
          grep -F 'private val minDisplayHits: Int = 1' "$APP/src/main/java/com/autonomousdiagnosis/app/VideoDetectionTracker.kt"
          grep -F 'private val minDecisionHits: Int = 3' "$APP/src/main/java/com/autonomousdiagnosis/app/VideoDetectionTracker.kt"
          grep -F 'const float raw_x1=out.row(0)[a]' "$APP/src/main/cpp/native_detector.cpp"
          grep -F 'o.x1=(raw_x1-pad_left)/scale' "$APP/src/main/cpp/native_detector.cpp"
          ! grep -F 'cx-bw' "$APP/src/main/cpp/native_detector.cpp"
          ! grep -F 'panelPaint' "$APP/src/main/java/com/autonomousdiagnosis/app/DetectionOverlayView.kt"
          grep -F 'android:icon="@mipmap/ic_launcher"' "$APP/src/main/AndroidManifest.xml"
          grep -F 'xyxy + 11 sigmoid probabilities' v311_android_project/MODEL_CONTRACT.json
          ! grep -R -nE 'autonomous_diagnosis\.ncnn|5376|kTargetSize[[:space:]]*=[[:space:]]*512|TemporalConsensus|panelPaint' "$APP/src/main"

      - name: Install build-only model placeholders
        shell: bash
        run: |
          set -euxo pipefail
          ASSETS=v311_android_project/app/src/main/assets
          rm -f "$ASSETS"/*.ncnn.param "$ASSETS"/*.ncnn.bin
          printf 'PLACEHOLDER' > "$ASSETS/unified_grapevine_yolo26s_640.ncnn.param"
          printf 'PLACEHOLDER' > "$ASSETS/unified_grapevine_yolo26s_640.ncnn.bin"
          test "$(stat -c%s "$ASSETS/unified_grapevine_yolo26s_640.ncnn.param")" -eq 11
          test "$(stat -c%s "$ASSETS/unified_grapevine_yolo26s_640.ncnn.bin")" -eq 11

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.22.1'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Download and verify ncnn 20260526 Android Vulkan
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ncnn-sdk/unpacked
          curl -L --fail --retry 3 \
            -o /tmp/ncnn-sdk/ncnn-20260526-android-vulkan.zip \
            https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip
          echo '26909c92eed35afed4a966b5e9e503fcb0a529691ea3f910ec2c94a4fff52804  /tmp/ncnn-sdk/ncnn-20260526-android-vulkan.zip' | sha256sum -c -
          unzip -q /tmp/ncnn-sdk/ncnn-20260526-android-vulkan.zip -d /tmp/ncnn-sdk/unpacked
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base=Path('/tmp/ncnn-sdk/unpacked')
          cands=list(base.rglob('arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake'))
          if len(cands)!=1: raise SystemExit(f'Expected one ncnnConfig.cmake, got {len(cands)}')
          package_root=cands[0].parents[4]
          dest=Path('v311_android_project/app/src/main/cpp/ncnn')
          if dest.exists(): shutil.rmtree(dest)
          shutil.copytree(package_root,dest)
          if not (dest/'arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake').exists(): raise SystemExit('ncnn copy failed')
          PY

      - name: Build unsigned v3.1.1 release APK
        shell: bash
        working-directory: v311_android_project
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect v3.1.1 APK and signing tools
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find v311_android_project/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"; test -f "$APK"
          mkdir -p v311_build_artifact/tools/lib
          cp "$APK" v311_build_artifact/AutonomousDiagnosis-v3.1.1-placeholder-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" v311_build_artifact/tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" v311_build_artifact/tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" v311_build_artifact/tools/lib/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" v311_build_artifact/tools/
          chmod +x v311_build_artifact/tools/zipalign v311_build_artifact/tools/apksigner v311_build_artifact/tools/aapt2
          {
            echo 'Autonomous Diagnosis Android v3.1.1'
            echo 'versionCode=311'
            echo 'versionName=3.1.1'
            echo 'applicationId=com.autonomousdiagnosis.app'
            echo 'compileSdk=36'
            echo 'targetSdk=36'
            echo 'minSdk=26'
            echo 'model=Unified_Grapevine_Disease_Detector YOLO26s 640x640 / 11 classes'
            echo 'fix=NCNN XYXY direct decoder'
            echo 'detection_threshold=0.25'
            echo 'decision_threshold=0.65 temporal'
            echo 'ui=Vulkan GPU switch restored + no black label panels + launcher icon'
            echo 'MODEL=PLACEHOLDER ONLY; real trained NCNN injected after build'
            echo "github_run_id=$GITHUB_RUN_ID"
          } > v311_build_artifact/BUILD_INFO.txt
          sha256sum "$APK" > v311_build_artifact/APK_PLACEHOLDER_SHA256.txt

      - name: Upload v3.1.1 build substrate
        uses: actions/upload-artifact@v4
        with:
          name: AutonomousDiagnosis-v3.1.1-xyxy-vulkan-substrate
          path: v311_build_artifact/
          if-no-files-found: error
          retention-days: 1
