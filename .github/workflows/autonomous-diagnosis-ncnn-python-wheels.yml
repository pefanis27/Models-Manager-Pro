name: Autonomous Diagnosis NCNN Python Wheels

on:
  push:
    branches:
      - autonomous-diagnosis-apk-build-20260816
  workflow_dispatch:

jobs:
  package-wheels:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact NCNN exporter Python wheels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p wheels
          python -m pip download --no-deps pnnx==20260526 -d wheels
          python -m pip download --no-deps ncnn -d wheels
          sha256sum wheels/* | tee wheels/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ncnn-pnnx-python-wheels-20260526
          path: wheels
          if-no-files-found: error
          retention-days: 1
