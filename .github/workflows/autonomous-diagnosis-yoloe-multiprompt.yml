name: Autonomous Diagnosis YOLOE MultiPrompt Teacher

on:
  push:
    branches:
      - autonomous-diagnosis-apk-build-20260816
  workflow_dispatch:

jobs:
  package-yoloe-multiprompt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ultralytics and CLIP support
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install ultralytics==8.4.114
          python -m pip install 'git+https://github.com/ultralytics/CLIP.git'
      - name: Configure vineyard multi-prompt teacher
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p yoloe_multi
          python - <<'PY'
          from ultralytics import YOLOE
          model=YOLOE('yoloe-11s-seg.pt')
          classes=['grape cluster','grape bunch','bunch of grapes','grapevine leaf','grape leaf','vine leaf','grape plant leaf']
          model.set_classes(classes)
          model.save('yoloe_multi/vineyard_yoloe_multiprompt_11s_seg.pt')
          print(model.names)
          PY
          sha256sum yoloe_multi/vineyard_yoloe_multiprompt_11s_seg.pt > yoloe_multi/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vineyard-yoloe-multiprompt-20260817
          path: yoloe_multi
          retention-days: 1
