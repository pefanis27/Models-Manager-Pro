name: Fetch FastSAM for Autonomous Diagnosis
on:
  push:
    branches: [autonomous-diagnosis-apk-build-20260816]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified FastSAM-s
        shell: bash
        run: |
          curl -L --fail --retry 3 -o FastSAM-s.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/FastSAM-s.pt
          echo "c9f78716a81c7aff0d608ccc73e1b82ab3aaad86005049f6a92106a0be6d0844  FastSAM-s.pt" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: FastSAM-s-verified
          path: FastSAM-s.pt
          retention-days: 1
