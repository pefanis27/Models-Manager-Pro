name: Temporary official YOLOE artifact bridge

on:
  push:
    branches:
      - chatgpt-yoloe-artifact-20260824
    paths:
      - .github/workflows/chatgpt-yoloe-artifact.yml

permissions:
  contents: write

jobs:
  prepare-yoloe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-yoloe-artifact-20260824

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install official Ultralytics runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade ultralytics

      - name: Download official YOLOE weights and record provenance
        run: |
          mkdir -p yoloe_artifact/weights yoloe_artifact/wheels
          cd yoloe_artifact/weights
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import ultralytics
          from ultralytics import YOLOE

          weights = ["yoloe-26n-seg.pt", "yoloe-26s-seg.pt"]
          for w in weights:
              print(f"Loading/downloading official {w}")
              YOLOE(w)
          Path("ULTRALYTICS_VERSION.txt").write_text(ultralytics.__version__ + "\n", encoding="utf-8")
          lines=[]
          for w in weights:
              p=Path(w)
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f"{h}  {p.name}  {p.stat().st_size}")
          Path("SHA256SUMS.txt").write_text("\n".join(lines)+"\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Download portable runtime wheels
        run: |
          python -m pip download --no-deps -d yoloe_artifact/wheels ultralytics polars ultralytics-thop
          python -m pip freeze > yoloe_artifact/PIP_FREEZE.txt

      - name: Upload official YOLOE artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-yoloe-runtime-weights
          path: yoloe_artifact/
          compression-level: 0
          retention-days: 1

      - name: Publish run-id marker on temporary branch
        run: |
          mkdir -p .chatgpt_temp
          printf '%s\n' "$GITHUB_RUN_ID" > .chatgpt_temp/yoloe_artifact_run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chatgpt_temp/yoloe_artifact_run_id.txt
          git commit -m 'ci: record YOLOE artifact run id' || true
          git push origin HEAD:chatgpt-yoloe-artifact-20260824
