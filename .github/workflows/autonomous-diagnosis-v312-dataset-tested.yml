name: Autonomous Diagnosis v3.1.2 Dataset-Tested APK

on:
  push:
    branches:
      - autonomous-diagnosis-final-apk-20260818
    paths:
      - 'V312_BUILD_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: autonomous-diagnosis-v312-dataset-tested
  cancel-in-progress: true

jobs:
  build-v312-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout final build branch
        uses: actions/checkout@v4
        with:
          ref: autonomous-diagnosis-final-apk-20260818

      - name: Publish workflow run id immediately
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tool_payload
          echo "$GITHUB_RUN_ID" > tool_payload/final_v312_RUN_ID.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tool_payload/final_v312_RUN_ID.txt
          if git diff --cached --quiet; then
            echo 'Run id already current.'
          else
            git commit -m "[skip ci] publish v3.1.2 APK run id $GITHUB_RUN_ID"
            git push origin HEAD:autonomous-diagnosis-final-apk-20260818
          fi

      - name: Reconstruct and verify v3.1.2 source payload
        shell: bash
        run: |
          set -euxo pipefail
          cp v312_payload/source.tar.gz.b64 /tmp/v312_source.tar.gz.b64
          echo '3d52ef495bc8a66d967fc4a91a2a042d8325c6c9ff3050d97ceff0c821fbb9a0  /tmp/v312_source.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/v312_source.tar.gz.b64 > /tmp/v312_source.tar.gz
          echo '238f7a54b6bc2c15a38c020a8e54846fcd7bdd57c1e4ee0927f20ac901c9920d  /tmp/v312_source.tar.gz' | sha256sum -c -
          rm -rf v312_android_project
          mkdir -p v312_android_project
          tar -xzf /tmp/v312_source.tar.gz -C v312_android_project
          test -f v312_android_project/app/src/main/cpp/native_detector.cpp
          test -f v312_android_project/app/src/main/java/com/autonomousdiagnosis/app/VideoDetectionTracker.kt
          test -f v312_android_project/HELDOUT_DATASET_AUDIT.txt

      - name: Verify v3.1.2 runtime and presentation contract
        shell: bash
        run: |
          set -euxo pipefail
          APP=v312_android_project/app
          CPP="$APP/src/main/cpp/native_detector.cpp"
          MAIN="$APP/src/main/java/com/autonomousdiagnosis/app/MainActivity.kt"
          TRACK="$APP/src/main/java/com/autonomousdiagnosis/app/VideoDetectionTracker.kt"
          OVER="$APP/src/main/java/com/autonomousdiagnosis/app/DetectionOverlayView.kt"

          grep -F 'versionCode = 312' "$APP/build.gradle.kts"
          grep -F 'versionName = "3.1.2"' "$APP/build.gradle.kts"
          grep -F 'compileSdk = 36' "$APP/build.gradle.kts"
          grep -F 'targetSdk = 36' "$APP/build.gradle.kts"
          grep -F 'constexpr int kTargetSize = 640;' "$CPP"
          grep -F 'constexpr int kAnchors = 8400;' "$CPP"
          grep -F 'merge_aligned_fragments(candidates);' "$CPP"
          grep -F 'net->opt.use_vulkan_compute=use_vulkan && ncnn::get_gpu_count()>0;' "$CPP"
          grep -F 'text="Vulkan GPU"' "$MAIN"
          grep -F 'isChecked=true' "$MAIN"
          grep -F 'NativeDetector.nativeInit(assets,true)' "$MAIN"
          grep -F 'private const val DETECTION_CONFIDENCE=0.25f' "$MAIN"
          grep -F 'private const val IOU_THRESHOLD=0.45f' "$MAIN"
          grep -F 'private val dropoutGraceMs: Long = 260L' "$TRACK"
          grep -F 'track.domain in freshDomains -> false' "$TRACK"
          test "$(grep -c 'canvas.drawRoundRect' "$OVER")" -eq 1
          test "$(grep -c 'canvas.drawRect' "$OVER" || true)" -eq 0
          ! grep -q 'outlinePaint' "$OVER"
          grep -F 'android:icon="@mipmap/ic_launcher"' "$APP/src/main/AndroidManifest.xml"
          ! grep -R -nE 'autonomous_diagnosis\.ncnn|5376|kTargetSize[[:space:]]*=[[:space:]]*512|panelPaint' "$APP/src/main"
          ! find "$APP/src/main/assets" -maxdepth 1 -type f -name '*.ncnn.*' | grep -q .
          ! find v312_android_project/model_source -maxdepth 1 -type f -name '*.pt' | grep -q .

      - name: Install build-only model placeholders
        shell: bash
        run: |
          set -euxo pipefail
          ASSETS=v312_android_project/app/src/main/assets
          mkdir -p "$ASSETS"
          printf 'PLACEHOLDER' > "$ASSETS/unified_grapevine_yolo26s_640.ncnn.param"
          printf 'PLACEHOLDER' > "$ASSETS/unified_grapevine_yolo26s_640.ncnn.bin"
          test "$(stat -c%s "$ASSETS/unified_grapevine_yolo26s_640.ncnn.param")" -eq 11
          test "$(stat -c%s "$ASSETS/unified_grapevine_yolo26s_640.ncnn.bin")" -eq 11

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.22.1'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Download and verify ncnn 20260526 Android Vulkan
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ncnn-sdk/unpacked
          curl -L --fail --retry 3 \
            -o /tmp/ncnn-sdk/ncnn-20260526-android-vulkan.zip \
            https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip
          echo '26909c92eed35afed4a966b5e9e503fcb0a529691ea3f910ec2c94a4fff52804  /tmp/ncnn-sdk/ncnn-20260526-android-vulkan.zip' | sha256sum -c -
          unzip -q /tmp/ncnn-sdk/ncnn-20260526-android-vulkan.zip -d /tmp/ncnn-sdk/unpacked
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base=Path('/tmp/ncnn-sdk/unpacked')
          cands=list(base.rglob('arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake'))
          if len(cands)!=1: raise SystemExit(f'Expected one ncnnConfig.cmake, got {len(cands)}')
          package_root=cands[0].parents[4]
          dest=Path('v312_android_project/app/src/main/cpp/ncnn')
          if dest.exists(): shutil.rmtree(dest)
          shutil.copytree(package_root,dest)
          if not (dest/'arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake').exists(): raise SystemExit('ncnn copy failed')
          PY

      - name: Build unsigned v3.1.2 release APK
        shell: bash
        working-directory: v312_android_project
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect v3.1.2 APK and signing tools
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find v312_android_project/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"; test -f "$APK"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          mkdir -p v312_build_artifact/tools/lib v312_build_artifact/tools/runtime-libs
          cp "$APK" v312_build_artifact/AutonomousDiagnosis-v3.1.2-placeholder-unsigned.apk
          cp "$BT/zipalign" v312_build_artifact/tools/
          cp "$BT/apksigner" v312_build_artifact/tools/
          cp "$BT/lib/apksigner.jar" v312_build_artifact/tools/lib/
          cp "$BT/aapt2" v312_build_artifact/tools/
          ldd "$BT/zipalign" | awk '/=> \/.*\(/ {print $3}' | while read -r lib; do cp -L "$lib" v312_build_artifact/tools/runtime-libs/ || true; done
          chmod +x v312_build_artifact/tools/zipalign v312_build_artifact/tools/apksigner v312_build_artifact/tools/aapt2
          cp v312_android_project/HELDOUT_DATASET_AUDIT.txt v312_build_artifact/
          cp v312_android_project/V3_1_2_FIX_AUDIT.txt v312_build_artifact/
          {
            echo 'Autonomous Diagnosis Android v3.1.2'
            echo 'versionCode=312'
            echo 'versionName=3.1.2'
            echo 'applicationId=com.autonomousdiagnosis.app'
            echo 'compileSdk=36'
            echo 'targetSdk=36'
            echo 'minSdk=26'
            echo 'model=Unified_Grapevine_Disease_Detector YOLO26s 640x640 / 11 classes'
            echo 'vulkan=restored/default-on when available + CPU fallback'
            echo 'fix=single overlay rectangle + ghost-track suppression + aligned-fragment merge'
            echo 'test=763-image held-out PT/NCNN audit completed before build'
            echo 'MODEL=PLACEHOLDER ONLY; real trained NCNN injected after build'
            echo "github_run_id=$GITHUB_RUN_ID"
          } > v312_build_artifact/BUILD_INFO.txt
          sha256sum "$APK" > v312_build_artifact/APK_PLACEHOLDER_SHA256.txt

      - name: Upload v3.1.2 build substrate
        uses: actions/upload-artifact@v4
        with:
          name: AutonomousDiagnosis-v3.1.2-dataset-tested-substrate
          path: v312_build_artifact/
          if-no-files-found: error
          retention-days: 1
