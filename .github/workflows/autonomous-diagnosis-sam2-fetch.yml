name: Autonomous Diagnosis SAM2 Asset

on:
  push:
    branches:
      - autonomous-diagnosis-apk-build-20260816
  workflow_dispatch:

jobs:
  fetch-sam2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download official Ultralytics SAM2.1 tiny checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/ultralytics/assets/releases/download/v0.0.0/sam2.1_t.pt \
            -o sam2.1_t.pt
          test -s sam2.1_t.pt
          sha256sum sam2.1_t.pt | tee sam2.1_t.pt.sha256
          ls -lh sam2.1_t.pt
      - uses: actions/upload-artifact@v4
        with:
          name: sam2.1_t-ultralytics-official
          path: |
            sam2.1_t.pt
            sam2.1_t.pt.sha256
          if-no-files-found: error
          retention-days: 1
