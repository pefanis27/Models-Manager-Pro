name: Autonomous Diagnosis ZIPALIGN Tool

on:
  push:
    branches:
      - autonomous-diagnosis-apk-build-20260816
  workflow_dispatch:

jobs:
  fetch-zipalign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Build Tools 36
        run: sdkmanager "build-tools;36.0.0"
      - name: Package zipalign and runtime library
        shell: bash
        run: |
          mkdir -p zipalign-tool
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          cp "$BT/zipalign" zipalign-tool/
          chmod +x zipalign-tool/zipalign
          LIBCPP="$(find "$BT" -type f -name 'libc++.so*' | head -n 1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" zipalign-tool/libc++.so
          ldd zipalign-tool/zipalign || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-zipalign-36-with-libcpp
          path: zipalign-tool/
          if-no-files-found: error
          retention-days: 1
